services:
  web:
    image: node:24-slim
    working_dir: /repo
    volumes:
      - .:/repo
      # keep pnpm store inside the container for speed, not in the bind mount
      - pnpm_store:/root/.local/share/pnpm
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BASE_PATH=/
      - NODE_ENV=development
      # Vite >= 6.1: platform sets this; Vite appends it to allowedHosts
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "npm install -g pnpm@9.15.9 && pnpm install --frozen-lockfile && pnpm --filter @workspace/ie-daily-control run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  pnpm_store:
