services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ie
      POSTGRES_PASSWORD: iedaily
      POSTGRES_DB: iedaily
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ie -d iedaily"]
      interval: 5s
      timeout: 3s
      retries: 10

  setup:
    image: node:24
    working_dir: /app
    entrypoint: ["sh", "-c"]
    command: ["corepack enable && pnpm install --frozen-lockfile"]
    volumes:
      - ./:/app
      - pnpm-store:/root/.local/share/pnpm/store
    environment:
      - CI=true

  web:
    image: node:24
    working_dir: /app
    entrypoint: ["sh", "-c"]
    command: ["corepack enable && pnpm --filter @workspace/ie-daily-control run dev"]
    volumes:
      - ./:/app
      - pnpm-store:/root/.local/share/pnpm/store
    environment:
      - PORT=3000
      - BASE_PATH=/
      - NODE_ENV=development
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - /run/base44/app.env
    ports:
      - "3000:3000"
    depends_on:
      setup:
        condition: service_completed_successfully

  api:
    image: node:24
    working_dir: /app
    entrypoint: ["sh", "-c"]
    command: ["corepack enable && pnpm --filter @workspace/api-server run dev"]
    volumes:
      - ./:/app
      - pnpm-store:/root/.local/share/pnpm/store
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DATABASE_URL=postgres://ie:iedaily@db:5432/iedaily
    ports:
      - "5000:5000"
    depends_on:
      setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy

volumes:
  pnpm-store:
